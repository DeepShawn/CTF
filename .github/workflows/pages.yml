name: 发布 Web 版

# 构建 dist/site 并推送到 gh-pages 分支，由 GitHub Pages 发布到 https://deepshawn.github.io/CTF/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 测试
        working-directory: core
        run: python -m unittest discover -s tests
      - name: 构建
        run: python scripts/build_web.py
      - name: 推送到 gh-pages 分支
        working-directory: dist/site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "发布 ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
