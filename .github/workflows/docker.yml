name: Docker 镜像

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "env/docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/docker/Dockerfile
          load: true
          tags: ctfkit:test
      - name: 检查两个 Python 版本与常用库
        run: |
          docker run --rm ctfkit:test ctfkit-check
          docker run --rm -v "$PWD/plan/snippets:/s" -w /s ctfkit:test sh -c 'for f in *.py; do python2 "$f" >/dev/null && python3 "$f" >/dev/null || exit 1; done; echo 示例脚本通过'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送到 GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/deepshawn/ctfkit:lite
            ghcr.io/deepshawn/ctfkit:latest
            ghcr.io/deepshawn/ctfkit:0.1.0
          labels: |
            org.opencontainers.image.source=https://github.com/DeepShawn/CTF
            org.opencontainers.image.description=CTFKit 完整环境：Python 2.7 与 Python 3 并存
            org.opencontainers.image.licenses=MIT
