name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: ctfkit（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # Python 由 uv 安装独立构建版本，较老的 3.8 在新版运行器上也能使用
      - uses: astral-sh/setup-uv@v6
      - name: 单元测试
        working-directory: core
        run: uv run --python ${{ matrix.python }} --no-project python -m unittest discover -s tests -v
      - name: 命令行
        working-directory: core
        run: |
          uv venv --python ${{ matrix.python }} /tmp/venv
          uv pip install --python /tmp/venv/bin/python .
          /tmp/venv/bin/ctfkit list
          echo "ZmxhZ3toaX0=" | /tmp/venv/bin/ctfkit run encoding.base64 -

  snippets:
    name: 讲解示例（Python 2.7 与 3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3
        run: for f in plan/snippets/*.py; do echo "== $f"; python3 "$f"; done
      - name: Python 2.7
        run: docker run --rm -v "$PWD:/w" -w /w -e PYTHONIOENCODING=utf-8 python:2.7-slim sh -c 'for f in plan/snippets/*.py; do echo "== $f"; python "$f" || exit 1; done'

  web:
    name: Web 版构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_web.py

  android:
    name: Android 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 构建 Debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ctfkit-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
